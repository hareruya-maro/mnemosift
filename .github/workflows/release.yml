name: Release Mnemosift

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0, without v prefix)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release macOS App
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "Sources/MnemosiftApp/Info.plist" 2>/dev/null || echo "0.1.0")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Mnemosift version: $VERSION"

      # Apple Developer ID 証明書のインポート (Secrets が設定されている場合のみ)
      - name: Import Apple Developer ID Certificate
        id: cert_setup
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pass' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $RUNNER_TEMP/certificate.p12 -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 証明書のアイデンティティ名を取得
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application:" | head -1 | sed -e 's/.*"\(.*\)".*/\1/')
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "Found Signing Identity: $SIGNING_IDENTITY"

      # App Store Connect API Key のセットアップ (Secrets が設定されている場合のみ)
      - name: Setup App Store Connect API Key for Notarization
        if: env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> $GITHUB_ENV
          echo "APPLE_API_KEY_ISSUER=$APPLE_API_KEY_ISSUER" >> $GITHUB_ENV

      # パッケージング & 公証 (証明書と公証情報がある場合は公証を実行、未設定時はAd-hoc署名でフォールバック)
      - name: Build, Package & Notarize (.app, .dmg, .zip)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          if [ -n "${SIGNING_IDENTITY:-}" ] && ([ -n "${APPLE_API_KEY_PATH:-}" ] || [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]); then
            echo "==> Running in Full Notarization Mode with $SIGNING_IDENTITY"
            ./scripts/package_release.sh --version "$VERSION" --identity "$SIGNING_IDENTITY" --notarize
          elif [ -n "${SIGNING_IDENTITY:-}" ]; then
            echo "==> Signing with Developer ID (Notarization skipped - credentials not provided)"
            ./scripts/package_release.sh --version "$VERSION" --identity "$SIGNING_IDENTITY"
          else
            echo "==> Running in Ad-hoc signature mode (Apple Developer ID not yet configured in Secrets)"
            ./scripts/package_release.sh --version "$VERSION"
          fi

      # 一時キーチェーンのクリーンアップ
      - name: Clean up temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      # GitHub Release の作成とアセットのアップロード
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Mnemosift v${{ steps.get_version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name || format('v{0}', steps.get_version.outputs.VERSION) }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/Mnemosift-v${{ steps.get_version.outputs.VERSION }}-macOS-arm64.zip
            dist/Mnemosift-macOS-arm64.zip
            dist/Mnemosift-v${{ steps.get_version.outputs.VERSION }}.dmg
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
