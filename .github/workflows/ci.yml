name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (macOS 15)
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift & Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Build Debug
        run: swift build -v

      - name: Run Tests
        run: swift test -v

      - name: Test Release Packaging Script
        run: |
          ./scripts/build_app.sh --configuration release
